# ==============================================================================
# Nginx Server Configuration - Lash & PMU Studio Mladá Boleslav
# High-Performance Static Delivery, Modern Security Headers & SSL
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name lash-studio.cz www.lash-studio.cz;
    return 301 https://www.lash-studio.cz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lash-studio.cz;
    return 301 https://www.lash-studio.cz$request_uri;

    ssl_certificate /etc/letsencrypt/live/lash-studio.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lash-studio.cz/privkey.pem;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lash-studio.cz;

    root /var/www/lash-studio-mb;
    index index.html;

    # SSL konfigurace
    ssl_certificate /etc/letsencrypt/live/lash-studio.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lash-studio.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Bezpečnostní hlavičky
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Komprese Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Statické assety s dlouhou cache
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Hlavní lokace
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Blokování skrytých souborů (.git, .env apod.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
